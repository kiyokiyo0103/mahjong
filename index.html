*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);

header p{margin:8px 0 0;color:var(--ink-2);max-width:62ch}

.tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;min-width:0}
.tile .k{font-size:11px;color:var(--ink-3);letter-spacing:.06em}
.tile .v{font-family:var(--font-num);font-size:clamp(20px,3.4vw,26px);font-weight:500;margin-top:4px;line-height:1.1}
.tile .s{font-size:11px;color:var(--ink-3);margin-top:5px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;min-width:0}
.card>h2{font-size:15px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card>h2 .sub{font-size:12px;font-weight:400;color:var(--ink-3)}

.bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:14px 0 6px}
.ctl{display:flex;align-items:center;gap:7px}
.ctl>span{font-size:11px;color:var(--ink-3);letter-spacing:.08em;white-space:nowrap}
.bar .grp{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface-2);border-radius:8px;padding:3px}
button{font:inherit;color:inherit;cursor:pointer}
.seg{border:0;background:transparent;border-radius:6px;padding:5px 11px;font-size:12.5px;color:var(--ink-2)}
.seg[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:500}
.seg:focus-visible,.chip:focus-visible,.th:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.plot{position:relative;margin-top:6px}
.plot svg{display:block;width:100%;height:auto;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;z-index:5;background:var(--surface);border:1px solid var(--border);
     border-radius:9px;padding:9px 11px;box-shadow:0 6px 22px rgba(0,0,0,.16);font-size:12px;min-width:132px}
.tip .th{font-size:11px;color:var(--ink-3);margin-bottom:6px;letter-spacing:.03em}
.tip .r{display:flex;align-items:center;gap:7px;justify-content:space-between;line-height:1.7}
.tip .nm{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tip i{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}

.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--axis);background:transparent;
      border-radius:999px;padding:4px 11px 4px 8px;font-size:12.5px;color:var(--ink-3);
      transition:background .12s,border-color .12s}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;
        background:transparent;box-shadow:inset 0 0 0 1.5px currentColor;opacity:.5}
.chip .nm{color:var(--ink-3)}
.chip[aria-pressed="true"]{border-style:solid;border-color:transparent;
      background:color-mix(in srgb, currentColor 13%, transparent)}
.chip[aria-pressed="true"] i{background:currentColor;box-shadow:none;opacity:1}
.chip[aria-pressed="true"] .nm{color:var(--ink);font-weight:500}
.chip:hover:not([disabled]){border-color:var(--ink-3)}
.chip[disabled]{opacity:.42;cursor:default}
.chip .n{font-family:var(--font-num);font-size:11.5px;color:var(--ink-3)}

      font-size:12px;color:var(--ink-2)}

.legend-hint .k{font-size:11px;color:var(--ink-3);letter-spacing:.06em}
.legend-head{font-size:11px;color:var(--ink-3);letter-spacing:.08em;margin:14px 0 -6px;width:100%}

.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:16px;align-items:start}

.meter span{position:absolute;top:0;bottom:0;border-radius:2px}

.tbl-wrap{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:460px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border)}

.th{background:none;border:0;padding:0;font:inherit;color:inherit;letter-spacing:.04em}

.swatch{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:middle}

    i = Math.max(lo, Math.min(hi, i));
    const rows = [];
    for (const n of geo.names) { const v = valueAt(D.series[n], i); if (v !== null) { const rv = v - geo.base[n]; rows.push({ n, v: rv, y: Y(rv) }); } }
    if (!rows.length) return;
    rows.sort((a, b) => Math.abs(a.y - py) - Math.abs(b.y - py));
    const near = rows.slice(0, 6).sort((a, b) => b.v - a.v);
    const x = X(i);
    hov.innerHTML = `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${M.t}" y2="${M.t + ih}" stroke="var(--axis)" stroke-width="1"/>`
      + near.map(r2 => `<circle cx="${x.toFixed(1)}" cy="${r2.y.toFixed(1)}" r="3.4" fill="${color(r2.n)}" stroke="var(--surface)" stroke-width="2"/>`).join("");
    const sess = D.sessions.filter(s2 => s2.i <= i).pop();
    tip.innerHTML = `<div class="th">第${i}半荘${sess ? " · " + jfull(sess.d) : ""}</div>`
      + near.map(r2 => `<div class="r"><span class="nm"><i style="background:${color(r2.n)}"></i>${r2.n}</span><span class="num ${r2.v > 0 ? "pos" : r2.v < 0 ? "neg" : ""}">${fmt(r2.v)}</span></div>`).join("");
    tip.hidden = false;
    const tw = tip.offsetWidth, pw = plot.clientWidth, left = px / sc + 16;
    tip.style.left = Math.max(4, Math.min(pw - tw - 4, left)) + "px";
    tip.style.top = Math.max(0, Math.min(geo.H / sc - tip.offsetHeight - 4, py / sc - 12)) + "px";
  };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => { tip.hidden = true; hov.innerHTML = ""; });
}

/* ---------- panels ---------- */
function ranked() { return Object.values(byName).filter(r => r.games > 0).sort((a, b) => b.total - a.total); }
function periodLabel() { return RANGES[state.range].label; }
function periodDates() {
  const a = D.sessions.filter(s2 => s2.i <= state.hi && s2.i + s2.n - 1 >= state.lo);
  return a.length ? a[0].d.replace(/-/g, ".") + " 〜 " + a[a.length - 1].d.replace(/-/g, ".") : "";
}
function renderTiles() {
  const kiyo = byName["きよ"], k = lastSess.r["きよ"], rk = ranked();
  const top = rk[0], myRank = rk.findIndex(r => r.name === "きよ") + 1;
  document.getElementById("tiles").innerHTML = [
    [periodLabel() + "の半荘数", (state.hi - state.lo + 1).toLocaleString("ja-JP"), periodDates()],
    ["きよの素点（" + periodLabel() + "）", fmt(kiyo.total), kiyo.games + "半荘 · 平均 " + fmt(kiyo.avg) + " / 半荘"],
    ["直近の卓（" + jdate(lastSess.d) + "）", (k === undefined ? "—" : fmt(k)), lastSess.n + "半荘 · " + Object.keys(lastSess.r).length + "人"],
    ["登場メンバー（" + periodLabel() + "）", rk.length + "人", top ? "トップは" + top.name + " " + fmt(top.total) + (myRank > 1 ? "（きよは" + myRank + "位）" : "") : ""]
  ].map(([k2, v, s]) => `<div class="tile"><div class="k">${k2}</div><div class="v ${typeof v === "string" && v.startsWith("+") ? "pos" : typeof v === "string" && v.startsWith("-") ? "neg" : ""}">${v}</div><div class="s">${s}</div></div>`).join("");
}

function renderLegend() {
  const mk = n => {
    const r = byName[n], on = state.visible.has(n) && r.games > 0;
    return `<button class="chip" data-p="${n}" aria-pressed="${on}" style="color:${color(n)}" title="${r.games ? (on ? "クリックで非表示" : "クリックで表示") : "この期間は不参加"}"${r.games ? "" : " disabled"}>`
      + `<i></i><span class="nm">${n}</span> <span class="n">${r.games ? fmt(r.total) : "—"}</span></button>`;
  };
  const coreIn = CORE.filter(n => byName[n].games > 0), coreOut = CORE.filter(n => byName[n].games === 0);
  const others = D.players.filter(n => !CORE.includes(n)).sort((a, b) => (b.games ? 0 : 0) + ((byName[b].games > 0) - (byName[a].games > 0)) || byName[b].total - byName[a].total);
  const shown = D.players.filter(n => state.visible.has(n) && byName[n].games > 0).length;
  const total = D.players.filter(n => byName[n].games > 0).length;
  document.getElementById("legend").innerHTML =
    `<div class="legend-hint"><b>名前をクリックすると線が消えます。</b>`
    + `<span class="k">表示中 ${shown} / ${total}人</span></div>`
    + `<div class="legend-head">対局数の多い8人</div>` + coreIn.concat(coreOut).map(mk).join("")
    + `<div class="legend-head">そのほか ${others.length}人</div>` + others.map(mk).join("");
}

function renderSess() {
  const rows = Object.entries(lastSess.r).sort((a, b) => b[1] - a[1]);
  const mx = Math.max(...rows.map(r => Math.abs(r[1])), 1);
  document.getElementById("sessSub").textContent = jfull(lastSess.d) + " · " + lastSess.n + "半荘";
  document.getElementById("sess").innerHTML = rows.map(([n, v]) => {
    const w = Math.abs(v) / mx * 50;
    const bar = v >= 0 ? `left:50%;width:${w}%;background:var(--pos)` : `right:50%;width:${w}%;background:var(--neg)`;
    return `<div class="row"><span>${n}</span><span class="meter"><span style="${bar}"></span></span>`
      + `<span class="num ${v > 0 ? "pos" : v < 0 ? "neg" : ""}" style="text-align:right">${fmt(v)}</span></div>`;
  }).join("");
}

function renderTable() {
  const key = state.sort, dir = state.dir;
  const rows = Object.values(byName).sort((a, b) => {
    if ((a.games > 0) !== (b.games > 0)) return a.games > 0 ? -1 : 1;
    const A = key === "name" ? a.name : key === "last" ? (lastSess.r[a.name] ?? -1e9) : a[key];
    const B = key === "name" ? b.name : key === "last" ? (lastSess.r[b.name] ?? -1e9) : b[key];
    return key === "name" ? A.localeCompare(B, "ja") * dir : (A - B) * dir;
  });
  document.getElementById("tbody").innerHTML = rows.map(r => {
    const l = lastSess.r[r.name];
    return `<tr class="${state.visible.has(r.name) && r.games ? "" : "off"}" data-p="${r.name}">`
      + `<td><span class="swatch" style="background:${color(r.name)}"></span>${r.name}</td>`
      + `<td class="v ${r.games === 0 ? "" : r.total > 0 ? "pos" : r.total < 0 ? "neg" : ""}">${r.games ? fmt(r.total) : "—"}</td>`
      + `<td class="v">${r.games || "—"}</td><td class="v">${r.games ? fmt(r.avg) : "—"}</td>`
      + `<td class="v ${l > 0 ? "pos" : l < 0 ? "neg" : ""}">${l === undefined ? "—" : fmt(l)}</td></tr>`;
  }).join("");
}

function renderMeta() {
  document.getElementById("lede").textContent =
    `2024年5月から${jfull(D.lastDate)}まで、${D.sessions.length}回の卓・${D.nGames.toLocaleString("ja-JP")}半荘ぶんの素点。年を選ぶと、その年の頭をゼロにして積み直します。線は半荘ごとの累積で、打っていない半荘は横ばいです。`;
  document.getElementById("foot").innerHTML =
    `元データ：Dropbox <code>/麻雀</code> の <code>2024麻雀.xlsx</code> / <code>2025麻雀.xlsx</code> / <code>2026麻雀10.27.xlsx</code>。`
    + `各年の「まとめ」シートの素点を年順につなぎ、小計行と右側の素点累計ブロックの両方に一致することを確認しています（2026年は445行目＝9/28まで）。`
    + `10/13と10/27はまとめシートに未反映のため、各日付シートから直接読んでいます（タッグ戦は半荘として加算、やくまんのご祝儀行は素点ではないので除外）。`
    + `2026年のA列の卓マークは9/25以降だけ卓の末尾の行に付いていたので、9.25シートの小計と一致する行417〜422を9/25として区切り直しています。`
    + `<br>最終更新 ${D.generated}`;
}

function updateSub() {
  document.getElementById("chartSub").textContent =
    (state.range === "all" ? "2024年5月からの通算" : periodLabel() + "の頭をゼロにして積み直し");
}

/* ---------- events ---------- */
document.querySelectorAll("[data-range]").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("[data-range]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  state.range = b.dataset.range;
  renderAll();
}));
document.querySelectorAll("[data-preset]").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("[data-preset]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  const v = b.dataset.preset;
  state.visible = new Set(v === "all" ? D.players : v === "core" ? CORE : ["きよ"]);
  renderLegend(); renderTable(); draw();
}));
document.getElementById("legend").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  toggle(b.dataset.p);
});
document.getElementById("tbody").addEventListener("click", e => {
  const tr = e.target.closest("tr"); if (!tr) return;
  toggle(tr.dataset.p);
});
function toggle(n) {
  if (state.visible.has(n)) { if (state.visible.size > 1) state.visible.delete(n); } else state.visible.add(n);
  document.querySelectorAll("[data-preset]").forEach(x => x.setAttribute("aria-pressed", "false"));
  renderLegend(); renderTable(); draw();
}
document.querySelectorAll("[data-sort]").forEach(b => b.addEventListener("click", () => {
  const k = b.dataset.sort;
  if (state.sort === k) state.dir *= -1; else { state.sort = k; state.dir = k === "name" ? 1 : -1; }
  renderTable();
}));
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(draw, 120); });

function renderAll() {
  byName = periodStats();
  updateSub(); renderTiles(); renderLegend(); renderTable(); draw();
}
renderMeta(); renderSess(); renderAll();
</script>

</body></html>
